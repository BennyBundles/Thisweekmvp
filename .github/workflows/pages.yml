name: Deploy This Week to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-production"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production commit
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare exact production HTML
        run: |
          set -euo pipefail
          node prepare-site.mjs index.html index.production.html
          mv index.production.html index.html

      - name: Phase 0 static regression check
        run: node phase0-static-check.mjs

      - name: Production release smoke check
        run: node release-smoke-check.mjs

      - name: Build and validate public release preview
        run: |
          set -euo pipefail
          node prepare-public-preview.mjs index.html public-preview.validation-source.html
          node prepare-site.mjs public-preview.validation-source.html public-preview.validation.html
          node public-preview-check.mjs public-preview.validation.html
          rm -f public-preview.validation-source.html public-preview.validation.html

      - name: Validate Money Sandbox Lab
        run: node money-lab-check.mjs money-lab/index.html money-lab/app.js

      - name: Validate Account Center
        run: node account-check.mjs account/index.html account/app.js account/release-config.js

      - name: Validate Operations Console
        run: node ops-check.mjs ops/index.html ops/app.js

      - name: Validate Release Certification Console
        run: node phase34-check.mjs

      - name: Validate Support Center
        run: node support-check.mjs support/index.html support/app.js

      - name: Validate Sandbox legal fixtures
        run: node legal-check.mjs legal/sandbox/index.html

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated production commit
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage production site
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          node prepare-site.mjs index.html _site/index.html
          touch _site/.nojekyll

          mkdir -p _site/public-preview
          node prepare-public-preview.mjs index.html _site/public-preview.source.html
          node prepare-site.mjs _site/public-preview.source.html _site/public-preview/index.html
          rm -f _site/public-preview.source.html
          cp public-preview-manifest.webmanifest _site/public-preview/manifest.webmanifest
          cp public-preview-sw.js _site/public-preview/sw.js
          cp public-preview-icon.svg _site/public-preview/icon.svg
          cp preview.html _site/preview.html
          node public-preview-check.mjs _site/public-preview/index.html

          mkdir -p _site/money-lab
          cp money-lab/index.html _site/money-lab/index.html
          cp money-lab/app.js _site/money-lab/app.js
          node money-lab-check.mjs _site/money-lab/index.html _site/money-lab/app.js

          mkdir -p _site/account
          cp account/index.html _site/account/index.html
          cp account/app.js _site/account/app.js
          cp account/release-config.js _site/account/release-config.js
          node account-check.mjs _site/account/index.html _site/account/app.js _site/account/release-config.js

          mkdir -p _site/ops
          cp ops/index.html _site/ops/index.html
          cp ops/app.js _site/ops/app.js
          node ops-check.mjs _site/ops/index.html _site/ops/app.js

          mkdir -p _site/ops/release
          cp ops/release/index.html _site/ops/release/index.html
          cp ops/release/app.js _site/ops/release/app.js
          node phase34-check.mjs

          mkdir -p _site/support
          cp support/index.html _site/support/index.html
          cp support/app.js _site/support/app.js
          node support-check.mjs _site/support/index.html _site/support/app.js

          mkdir -p _site/legal/sandbox
          cp legal/sandbox/index.html _site/legal/sandbox/index.html
          node legal-check.mjs _site/legal/sandbox/index.html

          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('release.config.json','utf8'));
          const manifest = {
            application: 'This Week',
            release: cfg.release,
            channel: cfg.channel,
            commit: process.env.RELEASE_SHA,
            shortCommit: process.env.RELEASE_SHA.slice(0,8),
            rollbackCommit: cfg.rollbackCommit,
            rollbackBranch: cfg.rollbackBranch || null,
            stableBranch: cfg.stableBranch || null,
            workflowRunId: process.env.RELEASE_RUN_ID,
            stateSchema: cfg.stateSchema,
            portableSchema: cfg.portableSchema,
            migrationNotes: cfg.migrationNotes,
            deployedAt: new Date().toISOString()
          };
          fs.writeFileSync('_site/release.json', JSON.stringify(manifest,null,2) + '\n');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          SHORT="${RELEASE_SHA:0:8}"
          success=0

          for attempt in $(seq 1 12); do
            html="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/?v=${SHORT}" || true)"
            manifest="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/release.json?v=${SHORT}" || true)"
            preview="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/preview.html?v=${SHORT}" || true)"
            public_preview="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/public-preview/?mode=demo&v=${SHORT}" || true)"
            money_lab="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/money-lab/?v=${SHORT}" || true)"
            money_lab_js="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/money-lab/app.js?v=${SHORT}" || true)"
            account_center="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/account/?v=${SHORT}" || true)"
            account_js="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/account/app.js?v=${SHORT}" || true)"
            account_release_config="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/account/release-config.js?v=${SHORT}" || true)"
            ops_console="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/ops/?v=${SHORT}" || true)"
            ops_js="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/ops/app.js?v=${SHORT}" || true)"
            release_console="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/ops/release/?v=${SHORT}" || true)"
            release_console_js="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/ops/release/app.js?v=${SHORT}" || true)"
            support_center="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/support/?v=${SHORT}" || true)"
            support_js="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/support/app.js?v=${SHORT}" || true)"
            legal_sandbox="$(curl -fsSL --retry 2 --retry-delay 1 "${BASE}/legal/sandbox/?v=${SHORT}" || true)"

            if grep -Fq 'This Week' <<< "$html" \
              && grep -Fq -- "$RELEASE_SHA" <<< "$manifest" \
              && grep -Fq 'Public Release Preview' <<< "$preview" \
              && grep -Fq 'thisweek.publicPreview.state.v2' <<< "$public_preview" \
              && grep -Fq 'Money Sandbox Lab' <<< "$money_lab" \
              && grep -Fq '/functions/v1/thisweek-money-gateway' <<< "$money_lab_js" \
              && grep -Fq 'Account & Security' <<< "$account_center" \
              && grep -Fq '/functions/v1/thisweek-account-gateway' <<< "$account_js" \
              && grep -Fq 'THISWEEK_AUTH_RELEASE_CONFIG' <<< "$account_release_config" \
              && grep -Fq 'Operations Console' <<< "$ops_console" \
              && grep -Fq '/functions/v1/thisweek-ops-gateway' <<< "$ops_js" \
              && grep -Fq 'Release Evidence' <<< "$release_console" \
              && grep -Fq '/functions/v1/thisweek-release-gateway' <<< "$release_console_js" \
              && grep -Fq 'Support & Disputes' <<< "$support_center" \
              && grep -Fq '/functions/v1/thisweek-support-gateway' <<< "$support_js" \
              && grep -Fq 'accept_legal' <<< "$account_js" \
              && grep -Fq 'privacy_export_page' <<< "$account_js" \
              && grep -Fq 'set_legal_document_state' <<< "$ops_js" \
              && grep -Fq 'SANDBOX TEST ONLY.' <<< "$legal_sandbox"; then
              success=1
              break
            fi

            echo "Deployment verification attempt ${attempt}/12 not ready yet."
            sleep 5
          done

          if [ "$success" -ne 1 ]; then
            echo "Production verification failed for commit $RELEASE_SHA"
            exit 1
          fi

          {
            echo "### Production release verified"
            echo ""
            echo "- Commit: `$RELEASE_SHA`"
            echo "- Cache-busted URL: `${BASE}/?v=${SHORT}`"
            echo "- Manifest: `${BASE}/release.json?v=${SHORT}`"
            echo "- Public release preview: `${BASE}/preview.html?v=${SHORT}`"
            echo "- Standalone preview app: `${BASE}/public-preview/?mode=demo&v=${SHORT}`"
            echo "- Money Sandbox Lab: `${BASE}/money-lab/?v=${SHORT}`"
            echo "- Account & Security: `${BASE}/account/?v=${SHORT}`"
            echo "- Operations Console: `${BASE}/ops/?v=${SHORT}`"
            echo "- Release Certification: `${BASE}/ops/release/?v=${SHORT}`"
            echo "- Support & Disputes: `${BASE}/support/?v=${SHORT}`"
            echo "- Sandbox disclosure fixtures: `${BASE}/legal/sandbox/?v=${SHORT}`"
          } >> "$GITHUB_STEP_SUMMARY"
