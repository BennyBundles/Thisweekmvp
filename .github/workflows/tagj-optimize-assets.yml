name: TAGJ One-Time Asset Optimization

on:
  push:
    branches: ["tagj-v12-preview"]
    paths:
      - ".github/tagj-optimize-assets.trigger"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TAGJ preview branch
        uses: actions/checkout@v6
        with:
          ref: tagj-v12-preview
          fetch-depth: 1

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate WebP derivatives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          roots=[Path("tagj-assets/media"),Path("tagj-assets/network")]
          made=[]
          for root in roots:
              for p in root.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in {".jpg",".jpeg",".png"}:
                      continue
                  if p.stat().st_size < 120_000:
                      continue
                  out=p.with_suffix(".webp")
                  try:
                      with Image.open(p) as im:
                          im=ImageOps.exif_transpose(im)
                          if im.mode not in ("RGB","RGBA"):
                              im=im.convert("RGBA" if "A" in im.getbands() else "RGB")
                          im.save(out,"WEBP",quality=88,method=6)
                      if out.stat().st_size >= p.stat().st_size:
                          out.unlink()
                          continue
                      made.append((str(p),str(out),p.stat().st_size,out.stat().st_size))
                  except Exception as exc:
                      print("skip",p,exc)
          print("optimized",len(made),"assets")
          for src,out,a,b in made:
              print(f"{src} -> {out}: {a} -> {b} ({(1-b/a)*100:.1f}% smaller)")
          PY

      - name: Commit optimized derivatives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BennyBundles"
          git config user.email "146196050+BennyBundles@users.noreply.github.com"
          git add tagj-assets/media tagj-assets/network
          if git diff --cached --quiet; then
            echo "No smaller WebP derivatives were produced."
            exit 0
          fi
          git commit -m "Generate optimized TAGJ WebP derivatives"
          git push origin HEAD:tagj-v12-preview
