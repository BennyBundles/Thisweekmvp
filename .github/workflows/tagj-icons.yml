name: TAGJ One-Time Icon Generation

on:
  push:
    branches: ["tagj-v12-preview"]
    paths:
      - ".github/tagj-icons.trigger"

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TAGJ preview branch
        uses: actions/checkout@v6
        with:
          ref: tagj-v12-preview
          fetch-depth: 1

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build branded icon set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src=Image.open("tagj-assets/media/tagj-mark.webp").convert("RGBA")
          outdir=Path("tagj-assets/icons");outdir.mkdir(parents=True,exist_ok=True)

          def make(size,name,pad=.16):
              bg=Image.new("RGBA",(size,size),(5,8,12,255))
              inner=round(size*(1-2*pad))
              mark=src.copy()
              mark.thumbnail((inner,inner),Image.Resampling.LANCZOS)
              x=(size-mark.width)//2;y=(size-mark.height)//2
              bg.alpha_composite(mark,(x,y))
              bg.convert("RGB").save(outdir/name,"PNG",optimize=True)

          make(32,"favicon-32.png",.12)
          make(180,"apple-touch-icon.png",.15)
          make(192,"icon-192.png",.15)
          make(512,"icon-512.png",.15)
          make(512,"icon-512-maskable.png",.22)
          for p in sorted(outdir.iterdir()): print(p,p.stat().st_size)
          PY

      - name: Commit icon assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BennyBundles"
          git config user.email "146196050+BennyBundles@users.noreply.github.com"
          git add tagj-assets/icons
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate TAGJ mobile and install icon set"
          git pull --rebase origin tagj-v12-preview
          git push origin HEAD:tagj-v12-preview
