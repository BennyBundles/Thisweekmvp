name: TAGJ Preview QA

on:
  push:
    branches: ["tagj-v12-preview"]
    paths:
      - "index.html"
      - "preview.html"
      - "full.html"
      - "tagj.html"
      - "artist.html"
      - "producer.html"
      - "creative.html"
      - "campaign.html"
      - "contact.html"
      - "licensing.html"
      - "press.html"
      - "404.html"
      - "network/**"
      - "services/**"
      - "catalogue/**"
      - "beats/**"
      - "music/**"
      - "creative/**"
      - "tagj-assets/**"
      - "tagj-data/**"
      - "legal/**"
      - "scripts/build-tagj-preview.sh"
      - "scripts/prepare-tagj-release-candidate.sh"
      - "scripts/check-tagj-static.mjs"
      - "scripts/check-tagj-package.mjs"
      - "scripts/generate-tagj-seo.mjs"
      - "vercel.json"
      - ".github/workflows/tagj-preview-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Static regression gate
        run: node scripts/check-tagj-static.mjs

      - name: Build TAGJ preview package
        run: sh scripts/build-tagj-preview.sh

      - name: Verify packaged integrity
        run: node scripts/check-tagj-package.mjs

      - name: Verify packaged routes
        shell: bash
        run: |
          set -euo pipefail
          test -f .tagj-dist/index.html
          test -f .tagj-dist/preview.html
          test -f .tagj-dist/full.html
          test -f .tagj-dist/tagj.html
          test -f .tagj-dist/artist.html
          test -f .tagj-dist/producer.html
          test -f .tagj-dist/creative.html
          test -f .tagj-dist/campaign.html
          test -f .tagj-dist/contact.html
          test -f .tagj-dist/licensing.html
          test -f .tagj-dist/press.html
          test -f .tagj-dist/404.html
          test -f .tagj-dist/network/index.html
          test -f .tagj-dist/network/billyen.html
          test -f .tagj-dist/network/bsf-tone-066.html
          test -f .tagj-dist/network/t311y-demon-life.html
          test -f .tagj-dist/creative/index.html
          test -f .tagj-dist/creative/portfolio.html
          test -f .tagj-dist/creative/case-bsf-tone-066.html
          test -f .tagj-dist/creative/case-t311y-demon-life.html
          test -f .tagj-dist/tagj-data/beat-catalog.v1.json
          test -f .tagj-dist/tagj-data/catalog.v1.json
          test -f .tagj-dist/tagj-data/current-campaign.v1.json
          test -f .tagj-dist/tagj-data/license-system.v1.json
          test -f .tagj-dist/tagj-data/link-registry.v1.json
          test ! -f .tagj-dist/tagj-data/launch-gates.v1.json
          test ! -f .tagj-dist/tagj-data/business.v1.json
          test ! -f .tagj-dist/tagj-data/sample-review.v1.json
          test ! -f .tagj-dist/tagj-data/sample-rights-review.v1.json
          test -f .tagj-dist/legal/BEAT_LICENSE_EXCLUSIVE_DRAFT.md
          test -f .tagj-dist/tagj-assets/network/bsf-tone-066/profile.webp
          test -f .tagj-dist/tagj-assets/network/t311y-demon-life/profile.webp
          test -f .tagj-dist/tagj-assets/runtime-stability.js
          test -f .tagj-dist/tagj-assets/index-v1528.js
          test -f .tagj-dist/tagj-assets/full-v1528.js
          test -f .tagj-dist/tagj-assets/index-v1528.css
          test -f .tagj-dist/tagj-assets/full-v1528.css
          test ! -f .tagj-dist/tagj-assets/index-v1527.css
          test ! -f .tagj-dist/tagj-assets/full-v1527.css
          test ! -f .tagj-dist/tagj-assets/a01.css
          test -f .tagj-dist/tagj-assets/media/asset-fashion-hero.webp
          test -f .tagj-dist/tagj-assets/media/asset-green-set.webp
          test -f .tagj-dist/tagj-assets/media/asset-track-navy.webp
          printf 'Packaged TAGJ version: '
          cat .tagj-dist/VERSION.txt

      - name: Verify public SEO build mode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tagj-dist
          TAGJ_PUBLIC_ORIGIN=https://example.com sh scripts/build-tagj-preview.sh
          TAGJ_PUBLIC_ORIGIN=https://example.com node scripts/check-tagj-package.mjs
          grep -q '<loc>https://example.com/artist</loc>' .tagj-dist/sitemap.xml
          grep -q '<loc>https://example.com/campaign</loc>' .tagj-dist/sitemap.xml
          grep -q '<loc>https://example.com/network/billyen</loc>' .tagj-dist/sitemap.xml
          grep -q 'Sitemap: https://example.com/sitemap.xml' .tagj-dist/robots.txt

      - name: Summarize package
        shell: bash
        run: |
          {
            echo "## TAGJ Preview QA"
            echo ""
            echo "- Static regression gate: passed"
            echo "- Preview package build: passed"
            echo "- Version: $(cat .tagj-dist/VERSION.txt)"
            echo "- Packaged files: $(find .tagj-dist -type f | wc -l)"
            echo "- This workflow does not deploy or modify production."
          } >> "$GITHUB_STEP_SUMMARY"
