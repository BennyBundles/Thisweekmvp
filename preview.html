<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d16">
<title>This Week — Full Current Preview</title>
<style>
:root{
  --bg:#040a12;--panel:#081421;--line:rgba(177,206,221,.12);
  --text:#edf7fb;--soft:#91aab5;--mint:#6ee7b7;--aqua:#67e8f9;--gold:#f6d784;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 10% 0%,rgba(103,232,249,.09),transparent 25%),
  radial-gradient(circle at 90% 10%,rgba(110,231,183,.08),transparent 24%),
  linear-gradient(180deg,#040a12,#07111c 60%,#050d16);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
body{min-height:100dvh;display:flex;flex-direction:column}
.preview-bar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);
  background:rgba(4,10,18,.86);backdrop-filter:blur(18px)
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(246,215,132,.13),rgba(110,231,183,.12),rgba(103,232,249,.10));
  border:1px solid rgba(246,215,132,.16);font-weight:900;letter-spacing:-.05em
}
.brand-copy{min-width:0}
.brand-copy small{display:block;color:#96c9c0;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800}
.brand-copy strong{display:block;margin-top:2px;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
button,a.tool{
  appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);
  border-radius:999px;padding:8px 10px;font:inherit;font-size:.68rem;font-weight:760;text-decoration:none;cursor:pointer
}
button.active{background:linear-gradient(145deg,rgba(110,231,183,.12),rgba(103,232,249,.07));border-color:rgba(110,231,183,.20)}
.stage{flex:1;display:grid;place-items:center;padding:16px 12px 22px}
.device-shell{
  width:min(430px,100%);height:calc(100dvh - 92px);min-height:640px;max-height:900px;
  border-radius:36px;padding:8px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.10);box-shadow:0 34px 90px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.08);
  transition:width .4s cubic-bezier(.2,.8,.2,1),height .4s cubic-bezier(.2,.8,.2,1),border-radius .35s ease
}
.device-shell.full{width:min(100%,1180px);height:calc(100dvh - 92px);max-height:none;border-radius:24px}
.frame-wrap{width:100%;height:100%;overflow:hidden;border-radius:29px;background:#050d16;position:relative}
.device-shell.full .frame-wrap{border-radius:18px}
iframe{width:100%;height:100%;border:0;background:#050d16;display:block}
.preview-tag{
  position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:30;padding:7px 10px;border-radius:999px;background:rgba(4,10,18,.76);border:1px solid var(--line);
  color:var(--soft);font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;backdrop-filter:blur(14px);pointer-events:none
}
@media(max-width:650px){
  .preview-bar{align-items:flex-start}
  .brand-copy small{display:none}
  .brand-copy strong{font-size:.82rem}
  .tools{gap:5px}
  button,a.tool{padding:7px 9px;font-size:.62rem}
  .stage{padding:8px 0 12px}
  .device-shell{width:100%;height:calc(100dvh - 76px);min-height:0;max-height:none;border-radius:0;padding:0;border:0;box-shadow:none}
  .frame-wrap{border-radius:0}
  .preview-tag{display:none}
}
</style>
</head>
<body>
  <header class="preview-bar">
    <div class="brand">
      <div class="mark">TW</div>
      <div class="brand-copy"><small>Current live build</small><strong>This Week — Full Preview</strong></div>
    </div>
    <div class="tools">
      <button id="phoneBtn" class="active" type="button">iPhone</button>
      <button id="fullBtn" type="button">Full</button>
      <button id="reloadBtn" type="button">Reload</button>
      <a class="tool" href="./?v=a4d4f6e5" target="_blank" rel="noopener">Open App</a>
    </div>
  </header>
  <main class="stage">
    <div class="device-shell" id="shell">
      <div class="frame-wrap">
        <iframe id="previewFrame" title="This Week current live application" src="./?v=a4d4f6e5&preview=current" allow="clipboard-write"></iframe>
      </div>
    </div>
  </main>
  <div class="preview-tag">Current preview · simplified Home · four animated money categories</div>
<script>
const shell=document.getElementById('shell');
const phoneBtn=document.getElementById('phoneBtn');
const fullBtn=document.getElementById('fullBtn');
const reloadBtn=document.getElementById('reloadBtn');
const frame=document.getElementById('previewFrame');
function mode(full){
  shell.classList.toggle('full',full);
  phoneBtn.classList.toggle('active',!full);
  fullBtn.classList.toggle('active',full);
}
phoneBtn.onclick=()=>mode(false);
fullBtn.onclick=()=>mode(true);
reloadBtn.onclick=()=>{frame.src='./?v=a4d4f6e5&preview=current&reload='+Date.now()};
</script>
<script src="tagj-assets/runtime-stability.js" defer></script></body>
</html>
